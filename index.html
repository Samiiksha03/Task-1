
<!DOCTYPE html>
<html>
<head>
    <title>Secure Login System</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">
    <h2>Login Form </h2>

<script src="script.js"></script>
</body>
</html>
